name: Deploy to Cloudflare Pages

# Pushes to main deploy to production (custom domains spanishafterlife.com +
# www). The Pages project "spanish-afterlife" is direct-upload; this Action
# copies the site into a clean folder (excluding repo/docs files) and uploads
# it as a production deployment. Requires one repo secret:
#   CLOUDFLARE_API_TOKEN  (Account > Cloudflare Pages > Edit)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Build a clean publish dir. Pages serves EVERYTHING in the deploy folder
      # and does not honour .assetsignore for this project, so we exclude
      # repo/doc files explicitly rather than deploying the repo root.
      - name: Assemble site
        run: |
          mkdir _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='.gitignore' \
            --exclude='.assetsignore' \
            --exclude='README.md' \
            --exclude='HANDOFF.md' \
            --exclude='blog/_template.html' \
            ./ _site/

      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d6d2d8b5a9f263c661f21fd9f50b7fc2
          command: pages deploy _site --project-name=spanish-afterlife --branch=main --commit-dirty=true
